<title id="title">Full-parameter fine-tuning: recorded experiment</title><desc id="desc">113 training examples, four epochs and 452 optimizer updates trained 321908995 parameters on CPU. The diagnostic test improved from eight to ten correct out of twelve. Small inspected splits are not a production accuracy estimate.</desc>
