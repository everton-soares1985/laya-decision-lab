<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
<title id="title">Laya Decision Lab</title><desc id="desc">An experimental system combining CPU fine-tuning, hybrid retrieval and grounded generation. A classifier hint is not evidence; evidence is not permission.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091421"/><stop offset="1" stop-color="#182743"/></linearGradient><linearGradient id="line"><stop stop-color="#63ddbf"/><stop offset="1" stop-color="#819cff"/></linearGradient></defs>
<rect width="1280" height="420" rx="24" fill="url(#bg)"/>
<path d="M850 0V420M960 0V420M1070 0V420M1180 0V420M800 100H1280M800 210H1280M800 320H1280" stroke="#344660" opacity=".35"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="56" y="62" fill="#72dfc8" font-size="17" letter-spacing="3">GROWTHTECH · EXPERIMENTAL V1</text>
<text x="52" y="145" fill="#f2f6ff" font-size="62" font-weight="700">Laya Decision Lab</text>
<text x="56" y="191" fill="#c1cde2" font-size="25">From questions to evidence-grounded decisions.</text>
<rect x="56" y="229" width="192" height="44" rx="22" fill="#18382f"/>
<text x="152" y="257" text-anchor="middle" fill="#96f0d9" font-size="17">CPU fine-tuning</text>
<rect x="260" y="229" width="178" height="44" rx="22" fill="#213355"/>
<text x="349" y="257" text-anchor="middle" fill="#c2d1ff" font-size="17">Hybrid retrieval</text>
<rect x="450" y="229" width="207" height="44" rx="22" fill="#25354d"/>
<text x="553" y="257" text-anchor="middle" fill="#d6e1f5" font-size="17">Grounded generation</text>
<path d="M56 313H738" stroke="url(#line)" stroke-width="3"/>
<text x="56" y="355" fill="#a7b8d0" font-size="18">A topic is not a fact. A match is not permission.</text>
<g fill="#102238" stroke="#516e91" stroke-width="2"><rect x="867" y="68" width="286" height="70" rx="14"/><rect x="915" y="174" width="286" height="70" rx="14"/><rect x="867" y="280" width="286" height="70" rx="14"/></g>
